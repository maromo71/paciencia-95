[package]
name = "paciencia-desktop"
version = "1.0.0"
description = "Paciência 95 Desktop (Tauri)"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "paciencia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
paciencia-backend = { path = "../backend" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

